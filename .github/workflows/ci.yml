name: ci

# `task ci` on every OS ccswitch ships for; release.yml reuses this workflow
# and zips the bin/ artifacts it uploads.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version `task build` stamps
      # The tray (Wails v3) needs cgo: GTK and WebKitGTK on Linux; on macOS
      # the runner's Xcode tools are enough. The CLI is pure Go.
      - name: linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: tools
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: task ci
        shell: bash
        run: task ci
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ runner.os }}
          path: bin/
          if-no-files-found: error
